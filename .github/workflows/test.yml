name: Test
on:
  push:
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # weekly: the tests read the live data, so this catches data format changes
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
