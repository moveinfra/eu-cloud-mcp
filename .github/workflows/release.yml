# Push a tag vX.Y.Z to publish that version to npm and the MCP registry.
# No secrets: npm trusts this workflow (Trusted Publisher on npmjs.com), the MCP registry trusts GitHub OIDC.
# Bump the version in package.json, lib/server.js and server.json first: the job stops if they differ from the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check versions match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e '
            const v = process.argv[1];
            const pkg = require("./package.json"), srv = require("./server.json");
            const code = require("fs").readFileSync("lib/server.js", "utf8").match(/VERSION = .([\d.]+)/)[1];
            const all = { "package.json": pkg.version, "server.json": srv.version, "server.json package": srv.packages[0].version, "lib/server.js": code };
            const bad = Object.entries(all).filter(([, x]) => x !== v);
            if (bad.length) { console.error(`Tag ${v} but`, Object.fromEntries(bad)); process.exit(1); }
          ' "$v"
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        run: npm publish --access public
      - name: Publish to the MCP registry
        run: |
          # The registry checks the npm package; a new version can take a few minutes to appear there.
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 30); do
            [ "$(npm view "eu-cloud-mcp@$v" version 2>/dev/null)" = "$v" ] && break
            sleep 20
          done
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
